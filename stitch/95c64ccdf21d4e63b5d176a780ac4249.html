<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pause Overlay - ROOT_FIX // SNAKE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#5c3800",
                    "surface-container-high": "#272a2c",
                    "tertiary-container": "#ef9900",
                    "background": "#101415",
                    "outline-variant": "#3d4a3d",
                    "tertiary": "#ffba61",
                    "surface-dim": "#101415",
                    "inverse-on-surface": "#2d3133",
                    "secondary": "#b9c7e0",
                    "on-surface-variant": "#bccbb9",
                    "on-secondary-fixed": "#0d1c2f",
                    "on-secondary-container": "#abb9d2",
                    "surface-container-lowest": "#0b0f10",
                    "inverse-primary": "#006e2f",
                    "surface-variant": "#323537",
                    "on-secondary": "#233144",
                    "primary-fixed": "#6bff8f",
                    "on-error-container": "#ffdad6",
                    "secondary-container": "#3c4a5e",
                    "on-tertiary": "#472a00",
                    "on-primary-container": "#004b1e",
                    "surface-tint": "#4ae176",
                    "on-secondary-fixed-variant": "#3a485c",
                    "on-error": "#690005",
                    "surface-container": "#1d2022",
                    "primary-container": "#22c55e",
                    "error": "#ffb4ab",
                    "tertiary-fixed": "#ffddb8",
                    "primary": "#4be277",
                    "error-container": "#93000a",
                    "on-primary-fixed-variant": "#005321",
                    "surface": "#101415",
                    "on-background": "#e0e3e5",
                    "on-surface": "#e0e3e5",
                    "on-primary-fixed": "#002109",
                    "on-tertiary-fixed-variant": "#653e00",
                    "surface-bright": "#363a3b",
                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-container-highest": "#323537",
                    "surface-container-low": "#191c1e",
                    "on-primary": "#003915",
                    "outline": "#869585",
                    "inverse-surface": "#e0e3e5",
                    "primary-fixed-dim": "#4ae176",
                    "secondary-fixed": "#d5e3fd",
                    "secondary-fixed-dim": "#b9c7e0",
                    "on-tertiary-fixed": "#2a1700"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "40px",
                    "target-min": "44px",
                    "margin-mobile": "20px",
                    "unit": "4px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-md": [
                            "Hanken Grotesk"
                    ],
                    "stat-value": [
                            "JetBrains Mono"
                    ],
                    "headline-lg": [
                            "Hanken Grotesk"
                    ],
                    "status-label": [
                            "JetBrains Mono"
                    ],
                    "body-md": [
                            "Hanken Grotesk"
                    ]
            },
            "fontSize": {
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "stat-value": [
                            "20px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "status-label": [
                            "14px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "500"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .material-symbols-outlined.fill-icon {
          font-variation-settings:
          'FILL' 1,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        /* Custom grid background to simulate the game board under the modal */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, #334155 1px, transparent 1px),
                linear-gradient(to bottom, #334155 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- Top Navigation AppBar (Shared Component, Hidden on Mobile context if SideNav present, but present here for full layout context) -->
<header class="bg-background dark:bg-background border-b border-outline-variant flex justify-between items-center w-full px-margin-desktop h-target-min fixed top-0 z-10 w-full hidden md:flex">
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md font-bold tracking-tighter text-primary dark:text-primary">ROOT_FIX // SNAKE</span>
</div>
<div class="flex items-center gap-4 hidden"> <!-- search_bar hidden -->
</div>
<div class="flex items-center gap-2">
<button class="w-target-min h-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container dark:hover:bg-surface-container transition-colors duration-200 rounded">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
<button class="w-target-min h-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container dark:hover:bg-surface-container transition-colors duration-200 rounded">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<div class="flex flex-1 pt-0 md:pt-target-min">
<!-- Side Navigation (Shared Component) -->
<nav class="bg-surface-container-low dark:bg-surface-container-low border-r border-outline-variant fixed left-0 top-0 h-full flex flex-col pt-16 w-64 rounded-none hidden md:flex z-0">
<div class="p-4 border-b border-outline-variant mb-4">
<div class="font-headline-md text-headline-md font-black text-primary mb-1">SUPERVISOR</div>
<div class="font-status-label text-status-label text-on-surface-variant">OS_V1.0.4_STABLE</div>
</div>
<div class="flex-1 flex flex-col gap-1">
<a class="flex items-center gap-4 bg-primary text-on-primary font-bold px-4 py-3 rounded-none border-l-4 border-primary" href="#">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
<span class="font-status-label text-status-label">TERMINAL</span>
</a>
<a class="flex items-center gap-4 text-on-surface-variant hover:text-primary px-4 py-3 hover:bg-surface-container-high transition-all" href="#">
<span class="material-symbols-outlined" data-icon="emoji_events">emoji_events</span>
<span class="font-status-label text-status-label">RECORDS</span>
</a>
<a class="flex items-center gap-4 text-on-surface-variant hover:text-primary px-4 py-3 hover:bg-surface-container-high transition-all" href="#">
<span class="material-symbols-outlined" data-icon="memory">memory</span>
<span class="font-status-label text-status-label">SYSTEM</span>
</a>
</div>
<div class="p-4 mt-auto border-t border-outline-variant">
<button class="w-full h-target-min bg-surface border border-outline-variant text-on-surface hover:bg-primary hover:text-on-primary font-status-label text-status-label transition-colors">
                    REBOOT SESSION
                </button>
</div>
</nav>
<!-- Main Content Area - Simulating the Game Board underneath the modal -->
<main class="flex-1 ml-0 md:ml-64 relative min-h-screen bg-background overflow-hidden">
<!-- Simulated Game Board Grid (Underneath Modal) -->
<div class="absolute inset-0 bg-grid-pattern opacity-50 z-0"></div>
<!-- Simulated Game Elements (Snake & Food) -->
<div class="absolute top-[40%] left-[30%] w-10 h-10 bg-primary z-0"></div>
<div class="absolute top-[40%] left-[calc(30%-40px)] w-10 h-10 bg-primary z-0"></div>
<div class="absolute top-[40%] left-[calc(30%-80px)] w-10 h-10 bg-primary z-0"></div>
<div class="absolute top-[60%] left-[60%] w-10 h-10 bg-error z-0 rounded-none border-2 border-background"></div>
<!-- Pause Overlay Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-margin-mobile md:p-margin-desktop backdrop-blur-md bg-background/80 md:ml-64 mt-0 md:mt-target-min">
<div class="w-full max-w-md bg-surface border border-outline-variant p-8 flex flex-col gap-8 shadow-2xl">
<!-- Modal Header -->
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-widest uppercase mb-2">System Paused</h2>
<p class="font-status-label text-status-label text-on-surface-variant uppercase">Execution halted by supervisor</p>
</div>
<!-- Current Status Chips -->
<div class="flex justify-center gap-4 mb-4">
<div class="bg-surface-container px-4 py-2 border-t-2 border-primary border-x border-b border-x-outline-variant border-b-outline-variant">
<span class="font-status-label text-status-label text-on-surface-variant block mb-1">SCORE</span>
<span class="font-stat-value text-stat-value text-on-surface">0420</span>
</div>
<div class="bg-surface-container px-4 py-2 border-t-2 border-tertiary border-x border-b border-x-outline-variant border-b-outline-variant">
<span class="font-status-label text-status-label text-on-surface-variant block mb-1">LATENCY</span>
<span class="font-stat-value text-stat-value text-tertiary">24ms</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4">
<button class="w-full h-target-min bg-primary text-on-primary font-status-label text-status-label border border-primary hover:bg-primary-container hover:border-primary-container transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
                            RESUME EXECUTION
                        </button>
<button class="w-full h-target-min bg-surface text-on-surface font-status-label text-status-label border border-outline-variant hover:bg-surface-container transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                            RESTART SEQUENCE
                        </button>
<button class="w-full h-target-min bg-surface text-error font-status-label text-status-label border border-error/50 hover:bg-error/10 hover:border-error transition-colors flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-background mt-4">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
                            TERMINATE SESSION
                        </button>
</div>
</div>
</div>
</main>
</div>
</body></html>
