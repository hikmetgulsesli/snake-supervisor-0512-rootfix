<body class="bg-background text-on-surface font-body-md h-screen w-full flex overflow-hidden">
<!-- SideNavBar (WEB) -->
<nav class="hidden md:flex fixed left-0 top-0 h-full flex-col pt-16 bg-surface-container-low border-r border-outline-variant w-64 rounded-none z-50">
<div class="px-margin-desktop mb-8">

<p class="font-status-label text-status-label text-on-surface-variant mt-2">OS_V1.0.4_STABLE</p>
</div>
<div class="flex-1 flex flex-col mt-4">
<!-- Active Tab: TERMINAL (Assuming Game Board is part of terminal operations) -->
<a class="flex items-center gap-4 bg-primary text-on-primary font-status-label text-status-label font-bold px-4 py-3 rounded-none border-l-4 border-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">terminal</span>
                TERMINAL
            </a>
<a class="flex items-center gap-4 text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all font-status-label text-status-label px-4 py-3" href="#">
<span class="material-symbols-outlined">emoji_events</span>
                RECORDS
            </a>
<a class="flex items-center gap-4 text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all font-status-label text-status-label px-4 py-3" href="#">

            </a>
</div>
<div class="p-4 mt-auto">
<button class="w-full h-target-min border border-outline hover:border-primary text-on-surface hover:text-primary transition-colors font-status-label text-status-label flex items-center justify-center gap-2">
<span class="material-symbols-outlined">power_settings_new</span>
                 REBOOT SESSION
             </button>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col md:ml-64 relative h-full w-full">
<!-- TopAppBar (MOBILE & WEB) -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-target-min bg-background border-b border-outline-variant z-40 shrink-0 mt-4 md:mt-0">
<div class="flex items-center gap-2">
<!-- Mobile Menu Icon -->
<button class="md:hidden text-on-surface-variant p-2 -ml-2">
<span class="material-symbols-outlined">menu</span>
</button>
<span class="font-headline-md text-headline-md font-bold tracking-tighter text-primary">ROOT_FIX // SNAKE</span>
</div>
<div class="flex items-center gap-4 text-on-surface-variant">
<button class="p-2 hover:bg-surface-container transition-colors duration-200 rounded-DEFAULT">
<span class="material-symbols-outlined">help</span>
</button>
<button class="p-2 hover:bg-surface-container transition-colors duration-200 rounded-DEFAULT">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Play Area Wrapper -->
<div class="flex-1 flex flex-col lg:flex-row p-margin-mobile md:p-margin-desktop gap-gutter overflow-hidden bg-background">
<!-- Left Data Panel (HUD) -->
<aside class="w-full lg:w-64 flex flex-row lg:flex-col gap-4 shrink-0 overflow-x-auto lg:overflow-visible pb-4 lg:pb-0 scrollbar-hide">
<!-- Status Chip: Score -->
<div class="bg-surface border border-outline-variant p-4 flex-1 lg:flex-none min-w-[140px] border-t-2 border-t-primary">
<p class="font-status-label text-status-label text-on-surface-variant mb-1">SCORE</p>
<p class="font-stat-value text-stat-value text-primary">02450</p>
</div>
<!-- Status Chip: Length -->
<div class="bg-surface border border-outline-variant p-4 flex-1 lg:flex-none min-w-[140px] border-t-2 border-t-secondary">
<p class="font-status-label text-status-label text-on-surface-variant mb-1">LENGTH</p>
<p class="font-stat-value text-stat-value text-secondary">042</p>
</div>
<!-- Status Chip: Latency -->
<div class="bg-surface border border-outline-variant p-4 flex-1 lg:flex-none min-w-[140px] border-t-2 border-t-error">
<p class="font-status-label text-status-label text-on-surface-variant mb-1">LATENCY</p>
<p class="font-stat-value text-stat-value text-error">12ms</p>
</div>
<!-- Spacer -->
<div class="hidden lg:block flex-1"></div>
<!-- Controls Info (Web) -->
<div class="hidden lg:flex flex-col gap-2 mt-auto">
<p class="font-status-label text-status-label text-on-surface-variant mb-2 border-b border-outline-variant pb-2">INPUT_MAPPING</p>
<div class="flex items-center justify-between text-on-surface">
<span class="font-status-label text-status-label">MOVE</span>
<div class="flex gap-1">
<kbd class="bg-surface-container border border-outline-variant px-2 py-1 text-xs font-stat-value text-stat-value">W</kbd>
<kbd class="bg-surface-container border border-outline-variant px-2 py-1 text-xs font-stat-value text-stat-value">A</kbd>
<kbd class="bg-surface-container border border-outline-variant px-2 py-1 text-xs font-stat-value text-stat-value">S</kbd>
<kbd class="bg-surface-container border border-outline-variant px-2 py-1 text-xs font-stat-value text-stat-value">D</kbd>
</div>
</div>
<div class="flex items-center justify-between text-on-surface mt-2">
<span class="font-status-label text-status-label">PAUSE</span>
<kbd class="bg-surface-container border border-outline-variant px-3 py-1 text-xs font-stat-value text-stat-value">SPACE</kbd>
</div>
</div>
</aside>

<section class="flex-1 flex flex-col relative min-h-[400px]">
<!-- The Grid (Game Board) -->
<div class="flex-1 bg-surface border border-outline-variant relative overflow-hidden grid-overlay rounded-sm flex items-center justify-center">
<!-- Snake Head -->
<div class="absolute w-[20px] h-[20px] bg-primary rounded-sm shadow-[0_0_10px_rgba(75,226,119,0.5)]" style="left: 50%; top: 50%;"></div>
<!-- Snake Body Parts -->
<div class="absolute w-[20px] h-[20px] bg-primary-fixed-dim rounded-sm opacity-90" style="left: calc(50% - 20px); top: 50%;"></div>
<div class="absolute w-[20px] h-[20px] bg-primary-fixed-dim rounded-sm opacity-80" style="left: calc(50% - 40px); top: 50%;"></div>
<div class="absolute w-[20px] h-[20px] bg-primary-fixed-dim rounded-sm opacity-70" style="left: calc(50% - 40px); top: calc(50% + 20px);"></div>
<div class="absolute w-[20px] h-[20px] bg-primary-fixed-dim rounded-sm opacity-60" style="left: calc(50% - 40px); top: calc(50% + 40px);"></div>
<div class="absolute w-[20px] h-[20px] bg-primary-fixed-dim rounded-sm opacity-50" style="left: calc(50% - 60px); top: calc(50% + 40px);"></div>

<div class="absolute w-[20px] h-[20px] bg-error rounded-sm shadow-[0_0_15px_rgba(255,180,171,0.8)] animate-pulse" style="left: 70%; top: 30%;"></div>

<div class="hidden absolute inset-0 bg-background/80 backdrop-blur-md flex flex-col items-center justify-center z-10">
<h2 class="font-headline-lg text-headline-lg text-primary tracking-widest mb-4">SYSTEM_PAUSED</h2>
<button class="bg-primary text-on-primary border border-primary hover:bg-surface-tint font-status-label text-status-label px-8 h-target-min transition-colors shadow-[0_0_15px_rgba(75,226,119,0.3)]">

</div>
</div>

</button>
</div>
